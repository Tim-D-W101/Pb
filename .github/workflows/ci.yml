name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  GODOT_VERSION: "4.7.2"

jobs:
  sim:
    name: Build, sim tests, benchmark
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build solution (sim, tests, bench, game)
        run: dotnet build Pb.sln -c Release
      - name: Sim tests
        run: dotnet test tests/Pb.Sim.Tests -c Release --no-build --logger "console;verbosity=normal"
      - name: Network tests (messages, prediction, lag compensation, whole rounds without the engine)
        run: dotnet test tests/Pb.Net.Tests -c Release --no-build --logger "console;verbosity=normal"
      - name: Ballistics report and tick benchmark (reported, not gating)
        run: dotnet run -c Release --no-build --project tools/Pb.Bench -- --quick | tee -a "$GITHUB_STEP_SUMMARY"

  godot-smoke:
    name: Godot headless smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/.local/godot
          key: godot-${{ env.GODOT_VERSION }}-mono-linux-x86_64
      - name: Install Godot ${{ env.GODOT_VERSION }} (.NET)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: tools/ci/install-godot.sh "$GODOT_VERSION" ~/.local/godot
      - name: Build game assembly
        run: dotnet build game/Pb.csproj -c Debug
      - name: Import project
        run: tools/ci/import.sh ~/.local/godot/godot
      - name: Smoke tests (range autopilot + 1,000-ball stress mode; walk into the compound level)
        run: tools/ci/smoke-test.sh ~/.local/godot/godot

  net-round:
    name: Networked rounds (a dedicated server and five players, every area)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/.local/godot
          key: godot-${{ env.GODOT_VERSION }}-mono-linux-x86_64
      - name: Install Godot ${{ env.GODOT_VERSION }} (.NET)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: tools/ci/install-godot.sh "$GODOT_VERSION" ~/.local/godot
      - name: Build game assembly
        run: dotnet build game/Pb.csproj -c Debug
      - name: Import project
        run: tools/ci/import.sh ~/.local/godot/godot
      - name: Four rounds over UDP at 100 ms with jitter and loss, a trigger flipper and a fast clock among the players
        run: tools/ci/net-round.sh ~/.local/godot/godot | tee -a "$GITHUB_STEP_SUMMARY"

  windows-build:
    name: Windows build (download it from the run's Artifacts)
    needs: godot-smoke
    runs-on: ubuntu-24.04
    permissions:
      contents: write # publishes the build as the "test-build" release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/.local/godot
          key: godot-${{ env.GODOT_VERSION }}-mono-linux-x86_64
      - name: Install Godot ${{ env.GODOT_VERSION }} (.NET)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: tools/ci/install-godot.sh "$GODOT_VERSION" ~/.local/godot
      - name: Cache the export templates
        id: cache-templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}-mono-windows-linux-x86_64
      - name: Fetch the Windows and Linux export templates (just those, not the whole archive)
        if: steps.cache-templates.outputs.cache-hit != 'true'
        run: python3 tools/package/fetch-templates.py "$GODOT_VERSION" windows_release_x86_64.exe windows_release_x86_64_console.exe linux_release.x86_64
      - name: Build game assembly
        run: dotnet build game/Pb.csproj -c Debug
      - name: Import project
        run: tools/ci/import.sh ~/.local/godot/godot
      - name: Export the Windows build
        run: tools/package/windows-build.sh ~/.local/godot/godot builds/windows "$(echo "$HEAD_SHA" | cut -c1-7)"
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          # Reuse each published art pack while its asset is unchanged, so players don't download it again.
          PB_RELEASE_URL: https://github.com/${{ github.repository }}/releases/download/test-build
      - name: Package the dedicated servers (Linux and Windows; the Linux one is started once to check it serves)
        run: tools/package/server-build.sh ~/.local/godot/godot builds/windows/Pb builds/server
      - name: Install Wine
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends wine64
      - name: The Windows build plays a round on the Linux server under Wine
        run: tools/ci/wine-join.sh builds/server/linux/Pb-server builds/windows/Pb
      - name: Offer it for download
        uses: actions/upload-artifact@v4
        with:
          name: Pb-windows
          path: builds/windows/Pb
          retention-days: 30
      - name: Offer the dedicated servers for download
        uses: actions/upload-artifact@v4
        with:
          name: Pb-servers
          path: builds/server/release
          retention-days: 30
      # One link that always has the newest build, which Play.bat updates from (not for pull requests from forks).
      - name: Publish it as the latest test build
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          notes="The newest build of Pb ($(grep '^version=' builds/windows/release/manifest.txt | cut -d= -f2), $(grep '^date=' builds/windows/release/manifest.txt | cut -d= -f2)).
          First time: download Pb-windows.zip, unzip it and double-click Play.bat. Play.bat keeps the game up to date: before starting the game it downloads only the files that changed (the art comes in packs of its own, one per asset, Pb-art-*.pck).
          To run a dedicated server: Pb-server-windows.zip (Server.bat) or Pb-server-linux.tar.gz (run-server.sh), which keep themselves up to date the same way. Step by step: https://github.com/${GITHUB_REPOSITORY}/blob/${HEAD_SHA}/docs/hosting.md"
          gh release view test-build --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create test-build --repo "$GITHUB_REPOSITORY" --prerelease --target "$HEAD_SHA" --title "Pb: latest test build" --notes "$notes"
          # The files first and the manifest last, so a launcher or a server's update never reads a manifest whose
          # files aren't up yet.
          find builds/windows/release builds/server/release -maxdepth 1 -type f ! -name manifest.txt -print0 |
            xargs -0 gh release upload test-build --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload test-build builds/windows/release/manifest.txt --repo "$GITHUB_REPOSITORY" --clobber
          # Then whatever an older build published and this one doesn't (an art pack whose asset is gone,
          # the single art pack of builds before there was one per asset).
          gh release view test-build --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | while read -r name; do
            [ -f "builds/windows/release/$name" ] || [ -f "builds/server/release/$name" ] ||
              gh release delete-asset test-build "$name" --repo "$GITHUB_REPOSITORY" -y
          done
          gh release edit test-build --repo "$GITHUB_REPOSITORY" --notes "$notes"
